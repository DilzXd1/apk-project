<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GetsuzoXRat - Add Sender</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #161b22;
            --accent-green: #00ff66;
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        /* Top Bar Navigation */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: var(--card-bg);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .back-btn {
            font-size: 20px;
            cursor: pointer;
            color: var(--accent-green);
            text-decoration: none;
        }

        .app-title {
            font-weight: bold;
            font-size: 20px;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
            text-align: center;
            width: 100%;
        }

        /* Banner Slide Video */
        .banner-container {
            margin: 15px;
            border-radius: 15px;
            overflow: hidden;
            height: 160px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .banner-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Deskripsi / Notifikasi Bulat Mengkilat */
        .info-card {
            background: var(--card-bg);
            margin: 15px;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Logo Bulat Mengkilat HD (WhatsApp Style) */
        .logo-glossy-wa {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 15px;
            font-weight: bold;
            font-size: 18px;
            color: #ffffff;
            background: radial-gradient(circle at 30% 30%, #25D366 0%, #128C7E 70%, #075E54 100%);
            box-shadow: inset 0 4px 6px rgba(255,255,255,0.6), 
                        inset 0 -4px 6px rgba(0,0,0,0.4), 
                        0 0 15px rgba(37, 211, 102, 0.7);
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* Form Input Section */
        .form-container {
            background: var(--card-bg);
            margin: 15px;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .form-container h3 {
            margin-top: 0;
            color: var(--accent-green);
            border-bottom: 1px solid #30363d;
            padding-bottom: 8px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .input-group input {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: white;
            font-size: 15px;
        }

        .btn-action {
            padding: 12px;
            background: linear-gradient(90deg, #00ff66, #00bcff);
            color: black;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            transition: 0.3s;
        }

        .btn-action:hover {
            box-shadow: 0 0 15px var(--accent-green);
        }

        #pairing-result {
            margin-top: 15px;
            padding: 12px;
            background: #0d1117;
            border-radius: 8px;
            border: 1px dashed var(--accent-green);
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="/dashboard" class="back-btn">&#10140;</a>
        <div class="app-title">GetsuzoXRat</div>
    </div>

    <div class="banner-container">
        <video class="banner-video" autoplay loop muted playsinline>
            <source src="https://assets.mixkit.co/videos/preview/mixkit-abstract-laser-lights-background-41764-large.mp4" type="video/mp4">
        </video>
    </div>

    <div class="info-card">
        <div class="logo-glossy-wa">WA</div>
        <div>
            <div style="font-size: 12px; color: #8b949e;">Status Deskripsi Sender</div>
            <div style="font-weight: bold; font-size: 16px;" id="sender-count-text">Memuat data sender baileys...</div>
        </div>
    </div>

    <div class="form-container">
        <h3>Add WhatsApp Sender</h3>
        <div class="input-group">
            <label for="phone-number">Masukan Nomor Target Sender</label>
            <input type="text" id="phone-number" placeholder="Contoh: 62812345678">
            <button class="btn-action" onclick="requestPairing()">REQUEST PAIRING CODE</button>
        </div>

        <div id="pairing-result">
            <span style="color: #8b949e; font-size: 14px;">Silakan cek terminal backend server untuk menyalin kode pairing terbaru.</span>
        </div>
    </div>

    <script>
        // Mengambil info jumlah sender saat load halaman
        fetch('/api/dashboard-info')
            .then(res => res.json())
            .then(data => {
                document.getElementById('sender-count-text').innerText = `${data.senderCount} Jumlah BRP Sudah Di Add`;
            });

        async function requestPairing() {
            const num = document.getElementById('phone-number').value;
            if(!num) return alert("Nomor telepon tidak boleh kosong!");

            const res = await fetch('/api/whatsapp/pair', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phoneNumber: num })
            });
            const data = await res.json();
            
            if(data.success) {
                document.getElementById('pairing-result').style.display = 'block';
            } else {
                alert(data.message);
            }
        }
    </script>
</body>
</html>
