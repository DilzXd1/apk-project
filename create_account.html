<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GetsuzoXRat - Create Account</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #161b22;
            --accent-green: #00ff66;
            --accent-red: #ff3333;
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: var(--card-bg);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .back-btn {
            font-size: 20px;
            cursor: pointer;
            color: var(--accent-green);
            text-decoration: none;
        }

        .app-title {
            font-weight: bold;
            font-size: 20px;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
            text-align: center;
            width: 100%;
        }

        /* Logo User Bulat Mengkilat HD */
        .info-card {
            background: var(--card-bg);
            margin: 15px;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo-glossy-user {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 15px;
            font-size: 20px;
            background: radial-gradient(circle at 30% 30%, #00bcff 0%, #006699 70%, #003366 100%);
            box-shadow: inset 0 4px 6px rgba(255,255,255,0.6), 
                        inset 0 -4px 6px rgba(0,0,0,0.4), 
                        0 0 15px rgba(0, 188, 255, 0.6);
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* Form Card */
        .form-container {
            background: var(--card-bg);
            margin: 15px;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .form-container h3 {
            margin-top: 0;
            color: var(--accent-green);
            border-bottom: 1px solid #30363d;
            padding-bottom: 8px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .input-group input, .input-group select {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: white;
            font-size: 15px;
        }

        .btn-action {
            padding: 12px;
            background: linear-gradient(90deg, #00ff66, #00bcff);
            color: black;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        /* Peringatan Sistem Keren (Pop Up) */
        .cool-alert {
            display: none;
            position: fixed;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #ff3333 0%, #990000 100%);
            color: white;
            padding: 18px 30px;
            border-radius: 10px;
            font-weight: bold;
            box-shadow: 0 0 25px rgba(255, 51, 51, 0.8);
            z-index: 1000;
            border: 2px solid #ffffff;
            text-align: center;
            width: 85%;
            max-width: 340px;
            animation: shakeScreen 0.4s ease-in-out;
        }

        @keyframes shakeScreen {
            0%, 100% { transform: translateX(-50%); }
            20%, 60% { transform: translateX(-55%); }
            40%, 80% { transform: translateX(-45%); }
        }

        #result-box {
            margin-top: 15px;
            padding: 12px;
            background: #0d1117;
            border-radius: 8px;
            display: none;
            color: var(--accent-green);
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div id="violation-alert" class="cool-alert">
        ⛔ AKSES ILEGAL DITOLAK! ⛔<br>
        <span style="font-size: 11px; font-weight: normal; opacity: 0.9;">Tindakan ini direkam & dilaporkan ke Telegram Owner pusat.</span>
    </div>

    <div class="top-bar">
        <a href="/dashboard" class="back-btn">&#10140;</a>
        <div class="app-title">GetsuzoXRat</div>
    </div>

    <div class="info-card">
        <div class="logo-glossy-user">👤</div>
        <div>
            <div style="font-size: 12px; color: #8b949e;">Status Deskripsi User</div>
            <div style="font-weight: bold; font-size: 16px;" id="total-user-text">Memuat total user...</div>
        </div>
    </div>

    <div class="form-container">
        <h3>Create Account Management</h3>
        <div class="input-group">
            <label>Masukkan Username Baru</label>
            <input type="text" id="target-username" placeholder="Contoh: member_vip01">
            
            <label>Pilih Tingkat Peran (Role)</label>
            <select id="target-role">
                <option value="user biasa">User Biasa</option>
                <option value="reseller">Reseller</option>
                <option value="vip">VIP</option>
                <option value="owner">Owner</option>
            </select>
            
            <button class="btn-action" onclick="processCreateAccount()">GENERATE ACCOUNT</button>
        </div>

        <div id="result-box"></div>
    </div>

    <script>
        // Membaca data session login dari localStorage browser
        const currentSession = JSON.parse(localStorage.getItem('user')) || { username: 'Guest', role: 'user biasa' };

        fetch('/api/dashboard-info')
            .then(res => res.json())
            .then(data => {
                document.getElementById('total-user-text').innerText = `${data.totalUsers} Total User Terdaftar`;
            });

        async function processCreateAccount() {
            const targetUser = document.getElementById('target-username').value;
            const targetRole = document.getElementById('target-role').value;

            if(!targetUser) return alert("Username tidak boleh kosong!");

            // Validasi client-side: Jika role login adalah 'user biasa', langsung munculkan peringatan keren
            if (currentSession.role === "user biasa") {
                triggerCoolAlert();
            }

            const res = await fetch('/api/create-user', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    requesterRole: currentSession.role,
                    requesterUsername: currentSession.username,
                    targetUsername: targetUser,
                    targetRole: targetRole
                })
            });

            if (res.status === 403) {
                triggerCoolAlert();
                return;
            }

            const data = await res.json();
            if(data.success) {
                const box = document.getElementById('result-box');
                box.style.display = 'block';
                box.innerHTML = `
                    <strong>🎉 Akun Berhasil Dibuat!</strong><br>
                    👤 Username: <code>${data.username}</code><br>
                    🎖️ Role Peran: <code>${data.role}</code><br>
                    🔑 Password Acak: <span style="background:#222; color:#fff; padding:2px 6px; border-radius:4px;">${data.password}</span>
                `;
            } else {
                alert(data.message);
            }
        }

        function triggerCoolAlert() {
            const alertBox = document.getElementById('violation-alert');
            alertBox.style.display = 'block';
            setTimeout(() => { alertBox.style.display = 'none'; }, 4500);
        }
    </script>
</body>
</html>
